name: Build QuickName APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Lock Permanent Keystore in Repo
        run: |
          if [ ! -f app/permanent_debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/permanent_debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=QuickName, OU=Android, O=EasyWork, C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/permanent_debug.keystore
            git commit -m "Permanently lock signing key" || true
            git push || true
          fi
          mkdir -p ~/.android
          cp app/permanent_debug.keystore ~/.android/debug.keystore

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickName-AutoFill-APK
          path: app/build/outputs/apk/debug/app-debug.apk
